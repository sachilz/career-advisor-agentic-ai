services:
  career-advisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_advisor_ai
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Mount ChromaDB vector store directory for persistence across container restarts
      - ./rag/chroma_db:/app/rag/chroma_db
    restart: unless-stopped
